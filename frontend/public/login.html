<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — GeoMascotas</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="auth-page">
  <div class="card narrow">
    <h1>🐾 GeoMascotas</h1>
    <p class="muted">Inicia sesión para administrar tus mascotas.</p>

    <div id="error-box" class="error-box hidden"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
    </form>

    <p class="muted" style="margin-top: 16px; text-align: center">
      ¿No tienes cuenta? <a href="registro.html">Regístrate</a>
    </p>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
