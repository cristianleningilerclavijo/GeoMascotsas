<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta — GeoMascotas</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="auth-page">
  <div class="card narrow">
    <h1>🐾 Crear cuenta</h1>
    <p class="muted">Regístrate para poder añadir a tus mascotas.</p>

    <div id="error-box" class="error-box hidden"></div>

    <form id="register-form">
      <div class="field">
        <label for="full_name">Nombre completo</label>
        <input type="text" id="full_name" name="full_name" required autocomplete="name" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="phone">Teléfono de contacto</label>
        <input type="tel" id="phone" name="phone" required autocomplete="tel" placeholder="099..." />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Crear cuenta</button>
    </form>

    <p class="muted" style="margin-top: 16px; text-align: center">
      ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
    </p>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
